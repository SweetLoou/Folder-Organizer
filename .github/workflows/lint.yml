name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell
        shell: bash
        run: pwsh --version

      - name: Run lint
        shell: pwsh
        run: ./tools/Invoke-Lint.ps1
